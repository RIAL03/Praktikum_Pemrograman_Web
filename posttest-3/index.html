<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeList SPA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full Page Loader -->
  <div id="page-loader" class="page-loader-overlay">
    <div class="loader"></div>
  </div>

  <div id="app-container">
    <!-- Header -->
    <header>
      <div class="logo">AnimeList</div>
      <div class="search-bar">
        <input type="text" placeholder="Search for something..." />
        <button>🔍</button>
      </div>
      <nav>
        <a href="#home">Home</a>
        <!-- Tombol Tema Mode Gelap/Terang -->
        <button id="theme-toggle" class="theme-button">🌙</button>
        <!-- Menu Pengguna -->
        <div class="user-menu">
          <button class="user-icon-button">👤</button>
          <div id="user-popup" class="popup-menu">
            <h4>RIAL03</h4>
            <ul>
              <li><a href="https://github.com/RIAL03" target="_blank" rel="noopener noreferrer">My GitHub Profile</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- App container -->
    <main id="app">
      <!-- Konten diganti via spa.js -->
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <p>© 2025 AnimeList. All Rights Reserved.</p>
        <div class="footer-links">
          <a href="#">About</a>
          <a href="#">Contact</a>
          <a href="https://anilist.co/">Reference</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
